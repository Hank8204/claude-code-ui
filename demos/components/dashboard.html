<!-- @dsCard group="Screens" viewport="1440x820" name="Dashboard — 專案總覽" subtitle="AgentAvatar 卡片點擊展開為 OfficeRoom" -->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dashboard</title>
<style>
:root{--bg:#eef1f5;--panel:#fff;--text:#1c2430;--text-dim:#64748b;--room-bg:#e2e8f0;--room-border:#cbd5e1;--plate-shadow:rgba(30,41,59,.16);--state-working:#3b82f6;--state-waiting:#f59e0b;--state-error:#ef4444;--burnout:#ef4444;--stamina-green:#22c55e;--stamina-yellow:#f59e0b;--stamina-red:#ef4444;--accent:#3b82f6}
@media (prefers-color-scheme: dark){:root{--bg:#0f141b;--panel:#1a222d;--text:#e6edf3;--text-dim:#8b98a8;--room-bg:#1e2733;--room-border:#33404f;--plate-shadow:rgba(0,0,0,.5)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"SF Pro Text","PingFang TC",sans-serif}
.topbar{display:flex;align-items:center;gap:10px;padding:14px 20px;background:var(--panel);border-bottom:1px solid var(--room-border);flex-wrap:nowrap;overflow-x:auto}
.topbar h1{font-size:16px;margin:0;white-space:nowrap}
.topbar input,.topbar select{font-size:12px;padding:7px 10px;border-radius:8px;border:1px solid var(--room-border);background:var(--bg);color:var(--text)}
.topbar input.path{flex:1;min-width:220px}
.topbar input.name{width:170px}
.browse-btn{font-size:12px;padding:7px 12px;border-radius:8px;border:1px solid var(--room-border);background:var(--bg);color:var(--text-dim)}
.auto-label{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text-dim);white-space:nowrap}
.new-btn{margin-left:auto;font-size:12px;font-weight:600;padding:8px 14px;border-radius:8px;border:none;background:var(--accent);color:#fff;white-space:nowrap}
.main{padding:20px;display:flex;flex-direction:column;gap:16px}
.group{border:1px solid var(--room-border);border-radius:12px;background:var(--panel);padding:16px}
.group-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.caret{border:none;background:none;color:var(--text-dim);font-size:11px;cursor:pointer}
.group-title{font-size:14px;font-weight:700}
.group-path{font-size:11px;color:var(--text-dim)}
.group-count{margin-left:auto;font-size:11px;color:var(--text-dim)}
.add-session-btn{font-size:12px;font-weight:600;padding:6px 12px;border-radius:8px;border:none;background:var(--accent);color:#fff}
.grid{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start}
.compact-card{width:180px;padding:12px;border-radius:12px;border:2px solid var(--room-border);background:var(--room-bg);cursor:pointer;text-align:center;display:grid;gap:6px;justify-items:center;transition:box-shadow .2s ease,transform .2s ease;position:relative}
.compact-card:hover{box-shadow:0 6px 16px var(--plate-shadow);transform:translateY(-2px)}
.expand-hint{position:absolute;top:8px;right:9px;font-size:11px;color:var(--text-dim)}
.session-plate{display:grid;gap:4px;justify-items:center;min-width:132px;max-width:158px;padding:12px 16px;border-radius:12px;border:2px solid var(--room-border);background:var(--panel);box-shadow:0 4px 12px var(--plate-shadow);transform-origin:50% 50%;transition:border-color .3s ease,color .3s ease,opacity .6s ease}
.session-name{font-size:14px;font-weight:650;line-height:1.25;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:138px}
.session-state{font-family:ui-monospace,Menlo,monospace;font-size:10px;letter-spacing:.04em;color:var(--text-dim)}
.session-plate[data-state='idle']{animation:plate-idle 3.2s ease-in-out infinite alternate}
@keyframes plate-idle{from{transform:translateY(0)}to{transform:translateY(-5px)}}
.session-plate[data-state='working']{border-color:var(--state-working);animation:plate-working .11s steps(2,end) infinite}
.session-plate[data-state='working'] .session-state{color:var(--state-working)}
@keyframes plate-working{0%{transform:translate(-1.5px,.5px)}100%{transform:translate(1.5px,-.5px)}}
.session-plate[data-state='committing']{border-color:var(--state-working);animation:plate-commit .62s ease-in-out infinite}
.session-plate[data-state='committing'] .session-state{color:var(--state-working)}
@keyframes plate-commit{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.session-plate[data-state='waiting_input']{border-color:var(--state-waiting);animation:plate-waiting 1s ease-in-out infinite}
.session-plate[data-state='waiting_input'] .session-state{color:var(--state-waiting)}
@keyframes plate-waiting{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(245,158,11,0)}50%{transform:scale(1.045);box-shadow:0 0 18px 2px rgba(245,158,11,.5)}}
.session-plate[data-state='error']{border-color:var(--state-error);transform:rotate(-2deg)}
.session-plate[data-state='error'] .session-name,.session-plate[data-state='error'] .session-state{color:var(--state-error)}
.session-plate[data-state='disconnected']{opacity:.35;filter:grayscale(1)}
.compact-card[data-burnout='true'] .session-plate{border-color:var(--burnout);animation:plate-burnout .24s ease-in-out infinite alternate}
.compact-card[data-burnout='true'] .session-state{color:var(--burnout)}
@keyframes plate-burnout{from{transform:translateX(-2px) rotate(-1.2deg)}to{transform:translateX(2px) rotate(1.2deg)}}

.office-room{position:relative;width:300px;border-radius:16px;background:var(--room-bg);border:3px solid var(--room-border);padding:10px;transition:border-color .3s ease,filter .6s ease}
.room-titlebar{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.room-name{background:none;border:none;color:var(--text);font-size:13px;font-weight:600;padding:0;cursor:pointer}
.collapse-btn,.stop-btn{margin-left:0;font-size:10px;color:var(--text-dim);background:none;border:1px solid var(--room-border);border-radius:4px;padding:1px 6px;cursor:pointer}
.stop-btn{margin-left:auto}
.office-room[data-state='working'],.office-room[data-state='committing']{border-color:var(--state-working)}
.office-room[data-state='waiting_input']{border-color:var(--state-waiting);animation:room-waiting 1s ease-in-out infinite}
.office-room[data-state='disconnected']{filter:brightness(.6)}
.office-room[data-burnout='true']{border-color:var(--burnout);animation:room-burnout 1s ease-in-out infinite}
@keyframes room-waiting{0%,100%{box-shadow:inset 0 0 0 0 rgba(245,158,11,0)}50%{box-shadow:inset 0 0 22px 2px rgba(245,158,11,.55)}}
@keyframes room-burnout{0%,100%{box-shadow:inset 0 0 0 0 rgba(239,68,68,0)}50%{box-shadow:inset 0 0 22px 2px rgba(239,68,68,.6)}}
.status-row{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;border:2px solid var(--room-border);background:var(--panel);transform-origin:50% 50%;transition:border-color .3s ease,opacity .6s ease;margin-bottom:8px}
.status-row .status-dot{width:8px;height:8px;border-radius:50%;background:var(--text-dim);flex:none}
.status-row .status-label{font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.04em;color:var(--text-dim)}
.status-row[data-state='idle']{animation:plate-idle 3.2s ease-in-out infinite alternate}
.status-row[data-state='working']{border-color:var(--state-working);animation:plate-working .11s steps(2,end) infinite}
.status-row[data-state='working'] .status-dot{background:var(--state-working)}
.status-row[data-state='working'] .status-label{color:var(--state-working)}
.status-row[data-state='committing']{border-color:var(--state-working);animation:plate-commit .62s ease-in-out infinite}
.status-row[data-state='committing'] .status-dot{background:var(--state-working)}
.status-row[data-state='committing'] .status-label{color:var(--state-working)}
.status-row[data-state='waiting_input']{border-color:var(--state-waiting);animation:plate-waiting 1s ease-in-out infinite}
.status-row[data-state='waiting_input'] .status-dot{background:var(--state-waiting)}
.status-row[data-state='waiting_input'] .status-label{color:var(--state-waiting)}
.status-row[data-state='error']{border-color:var(--state-error);transform:rotate(-1.4deg)}
.status-row[data-state='error'] .status-dot{background:var(--state-error)}
.status-row[data-state='error'] .status-label{color:var(--state-error)}
.status-row[data-state='disconnected']{opacity:.45;filter:grayscale(1)}
.office-room[data-burnout='true'] .status-row{border-color:var(--burnout);animation:plate-burnout .24s ease-in-out infinite alternate}
.office-room[data-burnout='true'] .status-dot{background:var(--burnout)}
.office-room[data-burnout='true'] .status-label{color:var(--burnout)}
.chat-panel{width:260px;border-radius:16px;background:var(--panel);border:2px solid var(--room-border);padding:12px;display:flex;flex-direction:column;gap:8px;animation:chat-slide-in .25s ease-out}
@keyframes chat-slide-in{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}
.chat-panel-head{font-size:11px;color:var(--text-dim);display:flex;justify-content:space-between;align-items:center}
.chat-log{display:flex;flex-direction:column;gap:6px;max-height:190px;overflow:auto}
.msg{max-width:86%;padding:6px 9px;border-radius:10px;font-size:11px;line-height:1.35}
.msg.user{align-self:flex-end;background:var(--state-working);color:#fff;border-radius:10px 10px 2px 10px}
.msg.agent{align-self:flex-start;background:var(--room-bg);color:var(--text);border:1px solid var(--room-border);border-radius:10px 10px 10px 2px;font-family:ui-monospace,Menlo,monospace}
.chat-panel[data-state='disconnected'] .msg{opacity:.5}
.chat-input-row{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:10px;border:1px solid var(--room-border);background:var(--room-bg)}
.chat-input-row input{flex:1;min-width:0;border:none;outline:none;background:transparent;color:var(--text);font-size:11px}
.chat-input-row input::placeholder{color:var(--text-dim)}
.chat-input-row .send-btn{font-size:10px;color:var(--text-dim);background:none;border:none;padding:2px 4px}
.expanded-row{display:flex;align-items:flex-start;gap:14px}
.controls-bar{margin-bottom:8px}
.controls-bar[data-disabled='true']{opacity:.5}
.controls-row{display:flex;gap:6px;margin-bottom:4px}
.controls-row:last-child{margin-bottom:0}
.controls-bar .ctrl{flex:1;display:flex;align-items:center;gap:4px;font-size:10px;color:var(--text-dim)}
.controls-bar select{flex:1;min-width:0;font-size:10px;padding:2px;border-radius:4px;border:1px solid var(--room-border);background:var(--panel);color:var(--text)}
.controls-bar .ctrl-key[data-model='opus']{color:#a855f7;font-weight:700}
.controls-bar .ctrl-key[data-model='sonnet']{color:var(--state-working);font-weight:700}
.ctrl-toggle{flex:1;font-size:10px;padding:3px 6px;border-radius:999px;border:1px solid var(--room-border);background:var(--panel);color:var(--text-dim);white-space:nowrap}
.ctrl-toggle[data-on='true']{border-color:var(--stamina-green);color:var(--text)}
.room-toolbar{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.room-toolbar button{flex:1 1 auto;padding:4px 6px;font-family:ui-monospace,Menlo,monospace;font-size:10px;color:var(--text-dim);border-radius:6px;border:1px solid var(--room-border);background:var(--panel);white-space:nowrap}
.room-toolbar button.compact-alert{font-weight:700;color:var(--stamina-red);border-color:var(--stamina-red);background:rgba(239,68,68,.08);animation:compact-pulse 1.1s ease-in-out infinite}
@keyframes compact-pulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}50%{box-shadow:0 0 10px 1px rgba(239,68,68,.45)}}
.room-actions{display:flex;gap:6px;margin-top:8px}
.restart-btn{flex:1;padding:7px 12px;border-radius:8px;border:1px solid var(--state-working);background:var(--state-working);color:#fff;font-size:13px}
.forget-btn{padding:7px 12px;border-radius:8px;border:1px solid var(--room-border);background:transparent;color:var(--text-dim);font-size:13px}
.stamina{margin-top:8px}
.stamina-track{width:100%;height:12px;border-radius:6px;background:var(--room-border);overflow:hidden}
.stamina-fill{height:100%;border-radius:6px}
.stamina-fill[data-zone='green']{background:var(--stamina-green)}
.stamina-fill[data-zone='yellow']{background:var(--stamina-yellow)}
.stamina-fill[data-zone='red']{background:var(--stamina-red)}
.stamina-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--text-dim);margin-top:6px}
@media (prefers-reduced-motion: reduce){.office-room *,.office-room,.session-plate{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="topbar">
  <h1>Claude Code UI</h1>
  <input class="path" value="/Users/you/IdeaProjects/YourProject" />
  <button class="browse-btn">瀏覽…</button>
  <input class="name" placeholder="session 名稱（可選）" />
  <select><option>預設模型</option></select>
  <select><option>預設深度</option></select>
  <label class="auto-label"><input type="checkbox" />自動批准</label>
  <button class="new-btn">+ 新增專案 + session</button>
</div>
<div class="main" id="main"></div>
<script>
const PROJECTS = [
  { name: 'claude-code-ui', path: '/Users/hanklin/IdeaProjects/claude-code-ui', sessions: [
    { id: 's1', name: 'API 重構', state: 'working', burnout: false, model: 'sonnet', effort: 'high', auto: false, fast: false,
      chat: [['user','把 /api/auth 改成 middleware 架構'],['agent','好的，正在掃描現有路由並拆分邏輯…']], stamina: ['green', 42, 'Context 42%', '$0.0180'] },
    { id: 's2', name: '等你確認', state: 'waiting_input', burnout: false, model: 'default', effort: '預設', auto: true, fast: false,
      chat: [['agent','要覆寫 tests/auth.test.ts 嗎？(y/n)']], stamina: ['yellow', 61, 'Context 61%', '$0.0640'] },
    { id: 's3', name: '快燒乾了', state: 'working', burnout: true, model: 'opus', effort: 'max', auto: true, fast: true,
      chat: [['agent','正在合併 12 個檔案的變更…']], stamina: ['red', 87, 'Context 87%', '$0.2210'] }
  ]},
  { name: 'growth-dashboard', path: '/Users/hanklin/IdeaProjects/growth-dashboard', sessions: [
    { id: 's4', name: '正在 commit', state: 'committing', burnout: false, model: 'sonnet', effort: 'medium', auto: false, fast: false,
      chat: [['agent','變更已完成，正在建立 commit…']], stamina: ['green', 55, 'Context 55%', '$0.0910'] },
    { id: 's5', name: 'docs-cleanup', state: 'idle', burnout: false, model: 'sonnet', effort: '預設', auto: false, fast: false,
      chat: [['agent','待命中，隨時可以交付新任務。']], stamina: ['green', 12, 'Context 12%', '$0.0020'] },
    { id: 's6', name: '已中斷', state: 'disconnected', burnout: false, model: 'sonnet', effort: 'medium', auto: false, fast: false,
      chat: [['user','幫我看一下這個錯誤'],['agent','連線已中斷']], stamina: ['green', 42, 'Context 42%（上次）', '$0.0180'] }
  ]}
]
const expanded = new Set()
function controls(model, effort, auto, fast, disabled) {
  return `<div class="controls-bar" data-disabled="${disabled}">
    <div class="controls-row">
      <label class="ctrl"><span class="ctrl-key" data-model="${model}">模型</span><select><option>${model === 'default' ? '預設' : model}</option></select></label>
      <label class="ctrl"><span class="ctrl-key">深度</span><select><option>${effort}</option></select></label>
    </div>
    <div class="controls-row">
      <button class="ctrl-toggle" data-on="${auto}">${auto ? '🟢 自動批准' : '⚪ 需確認'}</button>
      <button class="ctrl-toggle" data-on="${fast}">⚡ ${fast ? '極速' : '一般'}</button>
    </div>
  </div>`
}
function toolbar(alert) {
  return `<div class="room-toolbar"><button class="${alert ? 'compact-alert' : ''}">/compact</button><button>/clear</button><button>/rewind</button><button>/review</button></div>`
}
function stamina(zone, w, label, cost) {
  return `<div class="stamina"><div class="stamina-track"><div class="stamina-fill" data-zone="${zone}" style="width:${w}%"></div></div><div class="stamina-meta"><span>${label}</span><span>${cost}</span></div></div>`
}
function status(state, burnout) {
  return `<div class="status-row" data-state="${state}"><span class="status-dot"></span><span class="status-label">${burnout ? 'BURNOUT 87%' : LABELS[state]}</span></div>`
}
function chatPanel(s) {
  const disabled = s.state === 'disconnected'
  return `<div class="chat-panel" data-state="${s.state}">
    <div class="chat-panel-head"><span>對話（Terminal 轉換）</span><span>${s.name}</span></div>
    <div class="chat-log">${s.chat.map(m => `<div class="msg ${m[0]}">${m[1]}</div>`).join('')}</div>
    <div class="chat-input-row"><input placeholder="${disabled ? '連線已中斷…' : '輸入訊息給 Claude…'}" disabled><button class="send-btn">送出</button></div>
  </div>`
}
const LABELS = { idle: 'IDLE', working: 'WORKING', committing: 'COMMITTING', waiting_input: 'WAITING', error: 'ERROR', disconnected: 'DISCONNECTED' }
function renderCompact(s) {
  return `<div class="compact-card" data-burnout="${s.burnout}" data-id="${s.id}">
    <span class="expand-hint">⤢</span>
    <div class="session-plate" data-state="${s.state}">
      <div class="session-name">${s.name}</div>
      <div class="session-state">${s.burnout ? 'BURNOUT 87%' : LABELS[s.state]}</div>
    </div>
  </div>`
}
function renderExpanded(s) {
  const disabled = s.state === 'disconnected'
  const body = controls(s.model, s.effort, s.auto, s.fast, disabled)
    + status(s.state, s.burnout)
    + (disabled ? '<div class="room-actions"><button class="restart-btn">接回</button><button class="forget-btn">移除</button></div>' : toolbar(s.burnout))
    + stamina(...s.stamina)
  return `<div class="expanded-row" data-id="${s.id}">
    <div class="office-room" data-state="${s.state}" data-burnout="${s.burnout}">
      <div class="room-titlebar">
        <button class="room-name">${s.name}</button>
        <button class="collapse-btn" data-action="collapse">收合</button>
        ${disabled ? '' : '<button class="stop-btn">關閉 (Ctrl-C×2)</button>'}
      </div>
      ${body}
    </div>
    ${chatPanel(s)}
  </div>`
}
function render() {
  document.getElementById('main').innerHTML = PROJECTS.map(p => `
    <div class="group">
      <div class="group-head">
        <button class="caret">▾</button>
        <div><div class="group-title">${p.name}</div><div class="group-path">${p.path}</div></div>
        <span class="group-count">${p.sessions.length} 個 session</span>
        <button class="add-session-btn">+ 新增 session</button>
      </div>
      <div class="grid">${p.sessions.map(s => expanded.has(s.id) ? renderExpanded(s) : renderCompact(s)).join('')}</div>
    </div>`).join('')
}
document.getElementById('main').addEventListener('click', e => {
  const collapse = e.target.closest('[data-action="collapse"]')
  if (collapse) { expanded.delete(collapse.closest('.expanded-row').dataset.id); render(); return }
  const card = e.target.closest('.compact-card')
  if (card) { expanded.add(card.dataset.id); render() }
})
render()
</script>
</body>
</html>
