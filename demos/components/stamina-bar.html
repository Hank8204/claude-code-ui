<!-- @dsCard group="Components" name="StaminaBar — 體力條" subtitle="green / yellow / red(咖啡) / 未知(等待) / 未知(無對照) / 上次(stale)" -->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>StaminaBar</title>
<style>
  :root {
    --bg: #eef1f5; --panel: #fff; --text: #1c2430; --text-dim: #64748b;
    --room-bg: #e2e8f0; --room-border: #cbd5e1;
    --stamina-green: #22c55e; --stamina-yellow: #f59e0b; --stamina-red: #ef4444; --stamina-unknown: #94a3b8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f141b; --panel: #1a222d; --text: #e6edf3; --text-dim: #8b98a8;
      --room-bg: #1e2733; --room-border: #33404f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text); padding: 24px;
    font-family: -apple-system, "SF Pro Text", "PingFang TC", sans-serif;
  }
  .list { display: flex; flex-direction: column; gap: 16px; max-width: 320px; }
  .card { border: 1px solid var(--room-border); border-radius: 12px; background: var(--room-bg); padding: 12px; }
  .card > .caption { font-size: 11px; color: var(--text-dim); margin-bottom: 8px; }

  /* ---- 複製自 src/renderer/styles/avatar.css ---- */
  .stamina { margin-top: 0; }
  .stamina-track {
    width: 100%; height: 12px; border-radius: 6px; background: var(--room-border); overflow: hidden;
  }
  .stamina-fill { height: 100%; border-radius: 6px; transition: width .3s ease, background .3s ease; }
  .stamina-fill[data-zone='green'] { background: var(--stamina-green); }
  .stamina-fill[data-zone='yellow'] { background: var(--stamina-yellow); }
  .stamina-fill[data-zone='red'] { background: var(--stamina-red); }
  .stamina-fill[data-zone='unknown'] { background: var(--stamina-unknown); }
  .stamina-fill[data-stale='true'] {
    opacity: .55;
    background-image: repeating-linear-gradient(45deg,
      rgba(255,255,255,.35) 0, rgba(255,255,255,.35) 4px, transparent 4px, transparent 8px);
  }
  .stamina-meta {
    display: flex; justify-content: space-between; font-size: 11px; color: var(--text-dim); margin-top: 6px;
  }
  .coffee-btn {
    margin-top: 8px; width: 100%; padding: 7px 10px; font-size: 12px;
    border: 1px solid var(--stamina-red); color: var(--stamina-red); background: transparent;
    border-radius: 8px; cursor: pointer;
  }
</style>
</head>
<body>
  <div class="list" id="list"></div>
  <script>
    const V = [
      { cap: 'green — Context 45%', zone: 'green', w: 45, label: 'Context 45%', cost: '$0.0121', coffee: false },
      { cap: 'yellow — Context 68%', zone: 'yellow', w: 68, label: 'Context 68%', cost: '$0.0644', coffee: false },
      { cap: 'red — Context 88%（出現咖啡按鈕）', zone: 'red', w: 88, label: 'Context 88%', cost: '$0.1902', coffee: true },
      { cap: '未知 — 等待 transcript', zone: 'unknown', w: 100, label: 'Context 未知（等待 transcript）', cost: '—', coffee: false },
      { cap: '未知 — model 無對照', zone: 'unknown', w: 100, label: 'Context 未知（model 無對照：claude-x）', cost: '$0.02', coffee: false },
      { cap: 'stale — 接回後的舊值', zone: 'green', w: 45, label: 'Context 45%（上次）', cost: '$0.0121', coffee: false, stale: true }
    ]
    document.getElementById('list').innerHTML = V.map(v => `
      <div class="card">
        <div class="caption">${v.cap}</div>
        <div class="stamina">
          <div class="stamina-track">
            <div class="stamina-fill" data-zone="${v.zone}" data-stale="${!!v.stale}" style="width:${v.w}%"></div>
          </div>
          <div class="stamina-meta"><span>${v.label}</span><span>${v.cost}</span></div>
          ${v.coffee ? '<button class="coffee-btn">☕ 喝咖啡（清理 Context）</button>' : ''}
        </div>
      </div>`).join('')
  </script>
</body>
</html>
