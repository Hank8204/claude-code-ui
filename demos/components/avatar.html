<!-- @dsCard group="Avatar" name="AgentAvatar — 狀態" subtitle="Session 名稱框：震動 / 浮動 / 顏色（idle / working / committing / waiting_input / error / disconnected + burnout）" -->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AgentAvatar</title>
<style>
  :root{--bg:#eef1f5;--panel:#fff;--text:#1c2430;--text-dim:#64748b;--room-bg:#e2e8f0;--room-border:#cbd5e1;--state-working:#3b82f6;--state-waiting:#f59e0b;--state-error:#ef4444;--burnout:#ef4444;--plate-shadow:rgba(30,41,59,.16)}
  @media (prefers-color-scheme: dark){:root{--bg:#0f141b;--panel:#1a222d;--text:#e6edf3;--text-dim:#8b98a8;--room-bg:#1e2733;--room-border:#33404f;--plate-shadow:rgba(0,0,0,.5)}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"SF Pro Text","PingFang TC",sans-serif;padding:24px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px;max-width:900px}
  .cell{border:1px solid var(--room-border);border-radius:12px;background:var(--room-bg);padding:12px;text-align:center}
  .cell h3{margin:0 0 4px;font-size:12px}
  .cell p{margin:0 0 10px;font-size:10px;color:var(--text-dim)}
  .stage{position:relative;height:104px;display:grid;place-items:center}

  /* ---- 以下複製自 src/renderer/styles/avatar.css（純 transform / opacity / color） ---- */
  .avatar-anchor{position:relative;width:100%;display:grid;place-items:center}
  .avatar-burnout{transform-origin:50% 50%}
  .avatar-state{transform-origin:50% 50%;transition:border-color .3s ease,color .3s ease,opacity .6s ease}
  .session-plate{display:grid;gap:4px;justify-items:center;min-width:132px;max-width:170px;padding:12px 16px;border-radius:12px;border:2px solid var(--room-border);background:var(--panel);box-shadow:0 4px 12px var(--plate-shadow)}
  .session-name{font-size:14px;font-weight:650;line-height:1.25;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:138px}
  .session-state{font-family:ui-monospace,Menlo,monospace;font-size:10px;letter-spacing:.04em;color:var(--text-dim)}

  .avatar-state[data-state='idle']{animation:plate-idle 3.2s ease-in-out infinite alternate}
  @keyframes plate-idle{from{transform:translateY(0)}to{transform:translateY(-5px)}}

  .avatar-state[data-state='working']{border-color:var(--state-working);animation:plate-working .11s steps(2,end) infinite}
  .avatar-state[data-state='working'] .session-state{color:var(--state-working)}
  @keyframes plate-working{0%{transform:translate(-1.5px,.5px)}100%{transform:translate(1.5px,-.5px)}}

  .avatar-state[data-state='committing']{border-color:var(--state-working);animation:plate-commit .62s ease-in-out infinite}
  .avatar-state[data-state='committing'] .session-state{color:var(--state-working)}
  @keyframes plate-commit{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}

  .avatar-state[data-state='waiting_input']{border-color:var(--state-waiting);animation:plate-waiting 1s ease-in-out infinite}
  .avatar-state[data-state='waiting_input'] .session-state{color:var(--state-waiting)}
  @keyframes plate-waiting{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(245,158,11,0)}50%{transform:scale(1.045);box-shadow:0 0 18px 2px rgba(245,158,11,.5)}}

  .avatar-state[data-state='error']{border-color:var(--state-error);transform:rotate(-2deg)}
  .avatar-state[data-state='error'] .session-name{color:var(--state-error)}
  .avatar-state[data-state='error'] .session-state{color:var(--state-error)}

  .avatar-state[data-state='disconnected']{opacity:.35;filter:grayscale(1)}

  .avatar-burnout[data-burnout='true'] .avatar-state{border-color:var(--burnout);animation:plate-burnout .24s ease-in-out infinite alternate}
  .avatar-burnout[data-burnout='true'] .session-state{color:var(--burnout)}
  @keyframes plate-burnout{from{transform:translateX(-2px) rotate(-1.2deg)}to{transform:translateX(2px) rotate(1.2deg)}}

  @media (prefers-reduced-motion: reduce){
    .cell *,.cell{animation:none !important;transition:none !important}
    .avatar-state[data-state='waiting_input']{transform:scale(1.045);box-shadow:0 0 18px 2px rgba(245,158,11,.5)}
    .avatar-state[data-state='error']{transform:rotate(-2deg)}
    .avatar-state[data-state='disconnected']{opacity:.35}
  }
</style>
</head>
<body>
  <div class="grid" id="grid"></div>
  <script>
    const VARIANTS = [
      ['idle', 'false', '發呆', '緩慢上下浮動，中性色', 'docs-cleanup', 'IDLE'],
      ['working', 'false', '工作中', '高頻微震，藍色框線', 'API 重構', 'WORKING'],
      ['committing', 'false', 'committing', '整框跳動，藍色框線', 'auth-hotfix', 'COMMITTING'],
      ['waiting_input', 'false', '等待確認', '琥珀色呼吸放大 + 光暈', 'schema-migrate', 'WAITING'],
      ['error', 'false', '異常', '紅色 + 靜態傾斜', 'flaky-tests', 'ERROR'],
      ['disconnected', 'false', '已中斷', '灰階淡出至 35%', 'old-session', 'DISCONNECTED'],
      ['working', 'true', 'burnout', 'context > 80%，紅色左右搖晃', 'monorepo-split', 'BURNOUT 87%']
    ]
    document.getElementById('grid').innerHTML = VARIANTS.map(([s, b, title, desc, name, label]) => `
      <div class="cell">
        <h3>${title}</h3>
        <p>${desc}</p>
        <div class="stage">
          <div class="avatar-anchor">
            <div class="avatar-burnout" data-burnout="${b}">
              <div class="avatar-state session-plate" data-state="${s}">
                <div class="session-name">${name}</div>
                <div class="session-state">${label}</div>
              </div>
            </div>
          </div>
        </div>
      </div>`).join('')
  </script>
</body>
</html>
