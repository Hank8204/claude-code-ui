<!-- @dsCard group="Components" name="OfficeRoom — 工位卡片" subtitle="working / waiting_input / burnout / committing / disconnected" -->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OfficeRoom</title>
<style>
  :root {
    --bg: #eef1f5; --panel: #fff; --text: #1c2430; --text-dim: #64748b;
    --room-bg: #e2e8f0; --room-border: #cbd5e1; --desk: linear-gradient(160deg, #c9d2df, #aab6c6);
    --figure-light: #fff; --figure-mid: #e9edf3; --figure-dark: #c4ccd8; --ground-shadow: rgba(30, 41, 59, .28);
    --state-working: #3b82f6; --state-waiting: #f59e0b; --state-error: #ef4444; --burnout: #ef4444;
    --stamina-green: #22c55e; --stamina-yellow: #f59e0b; --stamina-red: #ef4444; --stamina-unknown: #94a3b8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f141b; --panel: #1a222d; --text: #e6edf3; --text-dim: #8b98a8;
      --room-bg: #1e2733; --room-border: #33404f; --desk: linear-gradient(160deg, #2b3644, #1d2531);
      --figure-mid: #dfe5ee; --figure-dark: #aab4c4; --ground-shadow: rgba(0, 0, 0, .55);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text); padding: 24px;
    font-family: -apple-system, "SF Pro Text", "PingFang TC", sans-serif;
  }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; max-width: 900px; }

  /* ===== 以下複製自 src/renderer/styles/avatar.css ===== */
  .office-room {
    position: relative; border-radius: 16px; background: var(--room-bg); border: 3px solid var(--room-border);
    padding: 10px; transition: border-color .3s ease, filter .6s ease;
  }
  .room-titlebar { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .room-name { background: none; border: none; color: var(--text); font-size: 13px; font-weight: 600; padding: 0; }
  .stop-btn {
    margin-left: auto; font-size: 10px; color: var(--text-dim); background: none;
    border: 1px solid var(--room-border); border-radius: 4px; padding: 1px 6px; cursor: pointer;
  }
  .room-stage {
    position: relative; display: block; width: 100%; height: 200px; border: none; border-radius: 12px;
    background: transparent; overflow: hidden;
  }
  .desk {
    position: absolute; left: 50%; bottom: 26px; width: 150px; height: 44px; transform: translateX(-50%);
    background: var(--desk); border-radius: 8px; box-shadow: 0 6px 14px rgba(0, 0, 0, .18);
  }
  .office-room[data-state='working'], .office-room[data-state='committing'] { border-color: var(--state-working); }
  .office-room[data-state='waiting_input'] { border-color: var(--state-waiting); animation: room-waiting 1s ease-in-out infinite; }
  .office-room[data-state='error'] { border-color: var(--state-error); }
  .office-room[data-state='disconnected'] { filter: brightness(.6); }
  .office-room[data-burnout='true'] { border-color: var(--burnout); animation: room-burnout 1s ease-in-out infinite; }
  @keyframes room-waiting { 0%, 100% { box-shadow: inset 0 0 0 0 rgba(245,158,11,0); } 50% { box-shadow: inset 0 0 22px 2px rgba(245,158,11,.55); } }
  @keyframes room-burnout { 0%, 100% { box-shadow: inset 0 0 0 0 rgba(239,68,68,0); } 50% { box-shadow: inset 0 0 22px 2px rgba(239,68,68,.6); } }

  .avatar-anchor { position: absolute; left: 50%; bottom: 60px; transform: translateX(-50%); width: 72px; height: 110px; }
  .ground-shadow {
    position: absolute; left: 50%; bottom: -6px; width: 60px; height: 16px; transform: translateX(-50%);
    background: radial-gradient(ellipse at center, var(--ground-shadow) 0%, transparent 70%); border-radius: 50%;
  }
  .ground-shadow[data-state='idle'] { animation: shadow-idle 3s ease-in-out infinite alternate; }
  .avatar-burnout, .avatar-state { width: 100%; height: 100%; transform-origin: 50% 90%; }
  .avatar-parts { position: absolute; inset: 0; }
  .head {
    position: absolute; left: 50%; top: 0; width: 34px; height: 34px; transform: translateX(-50%); border-radius: 50%;
    background: linear-gradient(135deg, var(--figure-light) 0%, var(--figure-mid) 55%, var(--figure-dark) 100%);
    box-shadow: inset -3px -4px 6px rgba(0, 0, 0, .12);
  }
  .body {
    position: absolute; left: 50%; top: 30px; width: 44px; height: 62px; transform: translateX(-50%);
    border-radius: 22px 22px 16px 16px;
    background: linear-gradient(135deg, var(--figure-light) 0%, var(--figure-mid) 55%, var(--figure-dark) 100%);
    box-shadow: inset -4px -5px 9px rgba(0, 0, 0, .14);
  }
  .arm {
    position: absolute; top: 34px; width: 12px; height: 44px; border-radius: 6px;
    background: linear-gradient(135deg, var(--figure-light), var(--figure-dark));
    box-shadow: inset -2px -2px 4px rgba(0, 0, 0, .12);
  }
  .arm.left { left: 6px; transform-origin: 50% 6px; }
  .arm.right { right: 6px; transform-origin: 50% 6px; }
  .avatar-parts::after {
    content: ''; position: absolute; left: 50%; top: -30px; transform: translate(-50%, 6px);
    font-size: 20px; opacity: 0; transition: opacity .3s ease, transform .3s ease;
  }
  .avatar-state[data-state='working'] .avatar-parts::after { content: '📝'; opacity: 1; transform: translate(-50%, 0); }
  .avatar-state[data-state='committing'] .avatar-parts::after { content: '📦'; opacity: 1; transform: translate(-50%, 0); }
  .avatar-state[data-state='waiting_input'] .avatar-parts::after { content: '❓'; opacity: 1; transform: translate(-50%, 0); }
  .avatar-burnout[data-burnout='true'] .avatar-parts::after { content: '🥵'; opacity: 1; transform: translate(-50%, 0); }
  .avatar-state[data-state='working'] { animation: fig-working .12s steps(2, end) infinite; }
  @keyframes fig-working { 0% { transform: translateX(-1px); } 100% { transform: translateX(1px); } }
  .avatar-state[data-state='working'] .arm.left { animation: arm-work .5s ease-in-out infinite alternate; }
  .avatar-state[data-state='working'] .arm.right { animation: arm-work .5s ease-in-out infinite alternate reverse; }
  @keyframes arm-work { from { transform: rotate(6deg); } to { transform: rotate(-14deg); } }
  .avatar-state[data-state='committing'] { animation: fig-commit .6s ease-in-out infinite; }
  @keyframes fig-commit { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  .avatar-state[data-state='committing'] .arm.left, .avatar-state[data-state='committing'] .arm.right { transform: rotate(-60deg); }
  .avatar-state[data-state='waiting_input'] { transform: scale(1.08); }
  .avatar-state[data-state='disconnected'] { opacity: .35; }
  .avatar-burnout[data-burnout='true'] { animation: fig-burnout .25s ease-in-out infinite alternate; }
  @keyframes fig-burnout { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }

  .controls-bar { margin-bottom: 8px; }
  .controls-bar[data-disabled='true'] { opacity: .5; }
  .controls-row { display: flex; gap: 6px; margin-bottom: 4px; }
  .controls-row:last-child { margin-bottom: 0; }
  .controls-bar .ctrl { flex: 1; display: flex; align-items: center; gap: 4px; font-size: 10px; color: var(--text-dim); }
  .controls-bar select {
    flex: 1; min-width: 0; font-size: 10px; padding: 2px; border-radius: 4px;
    border: 1px solid var(--room-border); background: var(--panel); color: var(--text);
  }
  .controls-bar .ctrl-key[data-model='opus'] { color: #a855f7; font-weight: 700; }
  .controls-bar .ctrl-key[data-model='sonnet'] { color: var(--state-working); font-weight: 700; }
  .ctrl-toggle {
    flex: 1; font-size: 10px; padding: 3px 6px; border-radius: 999px;
    border: 1px solid var(--room-border); background: var(--panel); color: var(--text-dim); cursor: pointer; white-space: nowrap;
  }
  .ctrl-toggle[data-on='true'] { border-color: var(--stamina-green); color: var(--text); }

  .room-toolbar { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .room-toolbar button {
    flex: 1 1 auto; padding: 4px 6px; font-family: ui-monospace, Menlo, monospace; font-size: 10px;
    color: var(--text-dim); border-radius: 6px; border: 1px solid var(--room-border); background: var(--panel); cursor: pointer; white-space: nowrap;
  }

  .room-actions { display: flex; gap: 6px; margin-top: 8px; }
  .restart-btn {
    flex: 1; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--state-working);
    background: var(--state-working); color: #fff; cursor: pointer; font-size: 13px;
  }
  .forget-btn {
    padding: 7px 12px; border-radius: 8px; border: 1px solid var(--room-border);
    background: transparent; color: var(--text-dim); cursor: pointer; font-size: 13px;
  }

  .stamina { margin-top: 8px; }
  .stamina-track { width: 100%; height: 12px; border-radius: 6px; background: var(--room-border); overflow: hidden; }
  .stamina-fill { height: 100%; border-radius: 6px; }
  .stamina-fill[data-zone='green'] { background: var(--stamina-green); }
  .stamina-fill[data-zone='yellow'] { background: var(--stamina-yellow); }
  .stamina-fill[data-zone='red'] { background: var(--stamina-red); }
  .stamina-fill[data-zone='unknown'] { background: var(--stamina-unknown); }
  .stamina-meta { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-dim); margin-top: 6px; }
  .coffee-btn {
    margin-top: 8px; width: 100%; padding: 7px 10px; font-size: 12px;
    border: 1px solid var(--stamina-red); color: var(--stamina-red); background: transparent; border-radius: 8px; cursor: pointer;
  }

  @media (prefers-reduced-motion: reduce) {
    .office-room *, .office-room { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <div class="grid" id="grid"></div>
  <script>
    function avatar(state, burnout) {
      return `<div class="room-stage">
        <div class="desk"></div>
        <div class="avatar-anchor">
          <div class="avatar-burnout" data-burnout="${burnout}">
            <div class="avatar-state" data-state="${state}">
              <div class="avatar-parts"><div class="head"></div><div class="body"></div><div class="arm left"></div><div class="arm right"></div></div>
            </div>
          </div>
          <div class="ground-shadow" data-state="${state}"></div>
        </div>
      </div>`
    }
    function controls(model, effort, auto, fast, disabled) {
      return `<div class="controls-bar" data-disabled="${disabled}">
        <div class="controls-row">
          <label class="ctrl"><span class="ctrl-key" data-model="${model}">模型</span><select><option>${model === 'default' ? '預設' : model}</option></select></label>
          <label class="ctrl"><span class="ctrl-key">深度</span><select><option>${effort}</option></select></label>
        </div>
        <div class="controls-row">
          <button class="ctrl-toggle" data-on="${auto}">${auto ? '🟢 自動批准' : '⚪ 需確認'}</button>
          <button class="ctrl-toggle" data-on="${fast}">⚡ ${fast ? '極速' : '一般'}</button>
        </div>
      </div>`
    }
    const toolbar = `<div class="room-toolbar"><button>/compact</button><button>/rewind</button><button>/review</button><button>Ctrl-C</button></div>`
    function stamina(zone, w, label, cost, coffee) {
      return `<div class="stamina">
        <div class="stamina-track"><div class="stamina-fill" data-zone="${zone}" style="width:${w}%"></div></div>
        <div class="stamina-meta"><span>${label}</span><span>${cost}</span></div>
        ${coffee ? '<button class="coffee-btn">☕ 喝咖啡（清理 Context）</button>' : ''}
      </div>`
    }

    const CARDS = [
      { name: 'API 重構', state: 'working', burnout: false,
        body: controls('sonnet', 'high', false, false, false) + avatar('working', false) + toolbar + stamina('green', 42, 'Context 42%', '$0.0180', false) },
      { name: '等你確認', state: 'waiting_input', burnout: false,
        body: controls('default', '預設', true, false, false) + avatar('waiting_input', false) + toolbar + stamina('yellow', 61, 'Context 61%', '$0.0640', false) },
      { name: '快燒乾了', state: 'working', burnout: true,
        body: controls('opus', 'max', true, true, false) + avatar('working', true) + toolbar + stamina('red', 87, 'Context 87%', '$0.2210', true) },
      { name: '正在 commit', state: 'committing', burnout: false,
        body: controls('sonnet', 'medium', false, false, false) + avatar('committing', false) + toolbar + stamina('green', 55, 'Context 55%', '$0.0910', false) },
      { name: '已中斷', state: 'disconnected', burnout: false,
        body: controls('sonnet', 'medium', false, false, true) + avatar('disconnected', false)
          + '<div class="room-actions"><button class="restart-btn">接回</button><button class="forget-btn">移除</button></div>'
          + stamina('green', 42, 'Context 42%（上次）', '$0.0180', false) }
    ]
    document.getElementById('grid').innerHTML = CARDS.map(c => `
      <div class="office-room" data-state="${c.state}" data-burnout="${c.burnout}">
        <div class="room-titlebar">
          <button class="room-name">${c.name}</button>
          ${c.state === 'disconnected' ? '' : '<button class="stop-btn">停止</button>'}
        </div>
        ${c.body}
      </div>`).join('')
  </script>
</body>
</html>
