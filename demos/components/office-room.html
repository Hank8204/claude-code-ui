<!-- @dsCard group="Components" name="OfficeRoom — 工位卡片" subtitle="快捷鍵/控制面板，狀態以框線震動/浮動/顏色表達：working / waiting_input / burnout / committing / disconnected" -->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OfficeRoom</title>
<style>
  :root {
    --bg: #eef1f5; --panel: #fff; --text: #1c2430; --text-dim: #64748b;
    --room-bg: #e2e8f0; --room-border: #cbd5e1; --plate-shadow: rgba(30, 41, 59, .16);
    --state-working: #3b82f6; --state-waiting: #f59e0b; --state-error: #ef4444; --burnout: #ef4444;
    --stamina-green: #22c55e; --stamina-yellow: #f59e0b; --stamina-red: #ef4444; --stamina-unknown: #94a3b8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f141b; --panel: #1a222d; --text: #e6edf3; --text-dim: #8b98a8;
      --room-bg: #1e2733; --room-border: #33404f; --plate-shadow: rgba(0, 0, 0, .5);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text); padding: 24px;
    font-family: -apple-system, "SF Pro Text", "PingFang TC", sans-serif;
  }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; max-width: 900px; }

  /* ===== 以下複製自 src/renderer/styles/avatar.css ===== */
  .office-room {
    position: relative; border-radius: 16px; background: var(--room-bg); border: 3px solid var(--room-border);
    padding: 10px; transition: border-color .3s ease, filter .6s ease;
  }
  .room-titlebar { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .room-name { background: none; border: none; color: var(--text); font-size: 13px; font-weight: 600; padding: 0; }
  .stop-btn {
    margin-left: auto; font-size: 10px; color: var(--text-dim); background: none;
    border: 1px solid var(--room-border); border-radius: 4px; padding: 1px 6px; cursor: pointer;
  }
  .status-row {
    display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 10px;
    border: 2px solid var(--room-border); background: var(--panel); transform-origin: 50% 50%;
    transition: border-color .3s ease, opacity .6s ease; margin-bottom: 8px;
  }
  .status-row .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-dim); flex: none; }
  .status-row .status-label { font-family: ui-monospace, Menlo, monospace; font-size: 11px; letter-spacing: .04em; color: var(--text-dim); }

  .status-row[data-state='idle'] { animation: plate-idle 3.2s ease-in-out infinite alternate; }
  @keyframes plate-idle { from { transform: translateY(0); } to { transform: translateY(-3px); } }
  .status-row[data-state='idle'] .status-dot { background: var(--text-dim); }

  .status-row[data-state='working'] { border-color: var(--state-working); animation: plate-working .11s steps(2, end) infinite; }
  .status-row[data-state='working'] .status-dot, .status-row[data-state='working'] .status-label { color: var(--state-working); background: var(--state-working); }
  .status-row[data-state='working'] .status-label { background: none; }
  @keyframes plate-working { 0% { transform: translate(-1.5px, .5px); } 100% { transform: translate(1.5px, -.5px); } }

  .status-row[data-state='committing'] { border-color: var(--state-working); animation: plate-commit .62s ease-in-out infinite; }
  .status-row[data-state='committing'] .status-dot { background: var(--state-working); }
  .status-row[data-state='committing'] .status-label { color: var(--state-working); }
  @keyframes plate-commit { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

  .status-row[data-state='waiting_input'] { border-color: var(--state-waiting); animation: plate-waiting 1s ease-in-out infinite; }
  .status-row[data-state='waiting_input'] .status-dot { background: var(--state-waiting); }
  .status-row[data-state='waiting_input'] .status-label { color: var(--state-waiting); }
  @keyframes plate-waiting { 0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(245,158,11,0); } 50% { transform: scale(1.03); box-shadow: 0 0 16px 2px rgba(245,158,11,.5); } }

  .status-row[data-state='error'] { border-color: var(--state-error); transform: rotate(-1.4deg); }
  .status-row[data-state='error'] .status-dot { background: var(--state-error); }
  .status-row[data-state='error'] .status-label { color: var(--state-error); }

  .status-row[data-state='disconnected'] { opacity: .45; filter: grayscale(1); }
  .status-row[data-state='disconnected'] .status-dot { background: var(--text-dim); }

  .office-room[data-burnout='true'] .status-row { border-color: var(--burnout); animation: plate-burnout .24s ease-in-out infinite alternate; }
  .office-room[data-burnout='true'] .status-dot { background: var(--burnout); }
  .office-room[data-burnout='true'] .status-label { color: var(--burnout); }
  @keyframes plate-burnout { from { transform: translateX(-2px) rotate(-1deg); } to { transform: translateX(2px) rotate(1deg); } }
  .office-room[data-state='working'], .office-room[data-state='committing'] { border-color: var(--state-working); }
  .office-room[data-state='waiting_input'] { border-color: var(--state-waiting); animation: room-waiting 1s ease-in-out infinite; }
  .office-room[data-state='error'] { border-color: var(--state-error); }
  .office-room[data-state='disconnected'] { filter: brightness(.6); }
  .office-room[data-burnout='true'] { border-color: var(--burnout); animation: room-burnout 1s ease-in-out infinite; }
  @keyframes room-waiting { 0%, 100% { box-shadow: inset 0 0 0 0 rgba(245,158,11,0); } 50% { box-shadow: inset 0 0 22px 2px rgba(245,158,11,.55); } }
  @keyframes room-burnout { 0%, 100% { box-shadow: inset 0 0 0 0 rgba(239,68,68,0); } 50% { box-shadow: inset 0 0 22px 2px rgba(239,68,68,.6); } }

  @keyframes compact-pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); } 50% { box-shadow: 0 0 10px 1px rgba(239,68,68,.45); } }

  .controls-bar { margin-bottom: 8px; }
  .controls-bar[data-disabled='true'] { opacity: .5; }
  .controls-row { display: flex; gap: 6px; margin-bottom: 4px; }
  .controls-row:last-child { margin-bottom: 0; }
  .controls-bar .ctrl { flex: 1; display: flex; align-items: center; gap: 4px; font-size: 10px; color: var(--text-dim); }
  .controls-bar select {
    flex: 1; min-width: 0; font-size: 10px; padding: 2px; border-radius: 4px;
    border: 1px solid var(--room-border); background: var(--panel); color: var(--text);
  }
  .controls-bar .ctrl-key[data-model='opus'] { color: #a855f7; font-weight: 700; }
  .controls-bar .ctrl-key[data-model='sonnet'] { color: var(--state-working); font-weight: 700; }
  .ctrl-toggle {
    flex: 1; font-size: 10px; padding: 3px 6px; border-radius: 999px;
    border: 1px solid var(--room-border); background: var(--panel); color: var(--text-dim); cursor: pointer; white-space: nowrap;
  }
  .ctrl-toggle[data-on='true'] { border-color: var(--stamina-green); color: var(--text); }

  .room-toolbar { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .room-toolbar button {
    flex: 1 1 auto; padding: 4px 6px; font-family: ui-monospace, Menlo, monospace; font-size: 10px;
    color: var(--text-dim); border-radius: 6px; border: 1px solid var(--room-border); background: var(--panel); cursor: pointer; white-space: nowrap;
  }

  .room-actions { display: flex; gap: 6px; margin-top: 8px; }
  .restart-btn {
    flex: 1; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--state-working);
    background: var(--state-working); color: #fff; cursor: pointer; font-size: 13px;
  }
  .forget-btn {
    padding: 7px 12px; border-radius: 8px; border: 1px solid var(--room-border);
    background: transparent; color: var(--text-dim); cursor: pointer; font-size: 13px;
  }

  .stamina { margin-top: 8px; }
  .stamina-track { width: 100%; height: 12px; border-radius: 6px; background: var(--room-border); overflow: hidden; }
  .stamina-fill { height: 100%; border-radius: 6px; }
  .stamina-fill[data-zone='green'] { background: var(--stamina-green); }
  .stamina-fill[data-zone='yellow'] { background: var(--stamina-yellow); }
  .stamina-fill[data-zone='red'] { background: var(--stamina-red); }
  .stamina-fill[data-zone='unknown'] { background: var(--stamina-unknown); }
  .stamina-meta { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-dim); margin-top: 6px; }
  .room-toolbar button.compact-alert {
    font-weight: 700; color: var(--stamina-red); border-color: var(--stamina-red); background: rgba(239, 68, 68, .08);
    animation: compact-pulse 1.1s ease-in-out infinite;
  }

  @media (prefers-reduced-motion: reduce) {
    .office-room *, .office-room { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <div class="grid" id="grid"></div>
  <script>
    const LABELS = { idle: 'IDLE', working: 'WORKING', committing: 'COMMITTING', waiting_input: 'WAITING', error: 'ERROR', disconnected: 'DISCONNECTED' }
    function status(state, burnout) {
      return `<div class="status-row" data-state="${state}"><span class="status-dot"></span><span class="status-label">${burnout ? 'BURNOUT 87%' : LABELS[state]}</span></div>`
    }
    function controls(model, effort, auto, fast, disabled) {
      return `<div class="controls-bar" data-disabled="${disabled}">
        <div class="controls-row">
          <label class="ctrl"><span class="ctrl-key" data-model="${model}">模型</span><select><option>${model === 'default' ? '預設' : model}</option></select></label>
          <label class="ctrl"><span class="ctrl-key">深度</span><select><option>${effort}</option></select></label>
        </div>
        <div class="controls-row">
          <button class="ctrl-toggle" data-on="${auto}">${auto ? '🟢 自動批准' : '⚪ 需確認'}</button>
          <button class="ctrl-toggle" data-on="${fast}">⚡ ${fast ? '極速' : '一般'}</button>
        </div>
      </div>`
    }
    function toolbar(alert) {
      return `<div class="room-toolbar"><button class="${alert ? 'compact-alert' : ''}">/compact</button><button>/clear</button><button>/rewind</button><button>/review</button></div>`
    }
    function stamina(zone, w, label, cost) {
      return `<div class="stamina">
        <div class="stamina-track"><div class="stamina-fill" data-zone="${zone}" style="width:${w}%"></div></div>
        <div class="stamina-meta"><span>${label}</span><span>${cost}</span></div>
      </div>`
    }

    const CARDS = [
      { name: 'API 重構', state: 'working', burnout: false,
        body: controls('sonnet', 'high', false, false, false)
          + status('working', false) + toolbar(false) + stamina('green', 42, 'Context 42%', '$0.0180') },
      { name: '等你確認', state: 'waiting_input', burnout: false,
        body: controls('default', '預設', true, false, false)
          + status('waiting_input', false) + toolbar(false) + stamina('yellow', 61, 'Context 61%', '$0.0640') },
      { name: '快燒乾了', state: 'working', burnout: true,
        body: controls('opus', 'max', true, true, false)
          + status('working', true) + toolbar(true) + stamina('red', 87, 'Context 87%', '$0.2210') },
      { name: '正在 commit', state: 'committing', burnout: false,
        body: controls('sonnet', 'medium', false, false, false)
          + status('committing', false) + toolbar(false) + stamina('green', 55, 'Context 55%', '$0.0910') },
      { name: '已中斷', state: 'disconnected', burnout: false,
        body: controls('sonnet', 'medium', false, false, true)
          + status('disconnected', false)
          + '<div class="room-actions"><button class="restart-btn">接回</button><button class="forget-btn">移除</button></div>'
          + stamina('green', 42, 'Context 42%（上次）', '$0.0180') }
    ]
    document.getElementById('grid').innerHTML = CARDS.map(c => `
      <div class="office-room" data-state="${c.state}" data-burnout="${c.burnout}">
        <div class="room-titlebar">
          <button class="room-name">${c.name}</button>
          ${c.state === 'disconnected' ? '' : '<button class="stop-btn">關閉 (Ctrl-C×2)</button>'}
        </div>
        ${c.body}
      </div>`).join('')
  </script>
</body>
</html>
